[package]
name = "qe-live-check"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Owner-run live-readiness, protective-order validation, checkpoint and arming tooling"

[features]
# Forwarded so the owner can build the order-sending commands:
#   cargo run -p qe-live-check --features live-orders -- validate ...
live-orders = ["qe-coindcx/live-orders"]

[[bin]]
name = "qe-live-check"
path = "src/main.rs"

[dependencies]
qe-coindcx = { path = "../qe-coindcx" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-str"] }
