[package]
name = "qe-coindcx"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Live order submission is compiled OUT by default. Even when this feature is
# enabled the runtime gate (operator flag + credentials) must also pass.
live-orders = []

[dependencies]
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
