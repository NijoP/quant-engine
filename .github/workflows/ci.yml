name: CI
on:
  push:
    branches: [main, "fm/**"]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Desk-owned crates are held to -D warnings; the whole workspace is linted and
      # reported (pre-existing qe-coindcx lints are tracked, not yet gating).
      - run: cargo clippy -p qe-engine -p qe-desk -p qe-risk --all-targets --no-deps -- -D warnings
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
  desk-artifact:
    # Release qe-desk + dashboard/dist for paper runs on machines that should not compile.
    if: startsWith(github.ref, 'refs/heads/fm/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: cargo build --release -p qe-desk
      - run: npm ci && npm run build
        working-directory: dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: qe-desk-linux-x86_64
          path: |
            target/release/qe-desk
            dashboard/dist
          retention-days: 3
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Worker branches: release binaries for local paper runs and research evaluation, so
  # workers on a memory-constrained machine never compile locally. Built from a copy at
  # /tmp/qe/src so the binaries' compile-time paths (configs/, dashboard/dist,
  # crates/qe-research/*.json) resolve once that path is linked to a local checkout.
  binaries:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fm/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          mkdir -p /tmp/qe
          cp -a "$GITHUB_WORKSPACE" /tmp/qe/src
          cd /tmp/qe/src
          cargo build --release -p qe-desk -p qe-research --bins
      - uses: actions/upload-artifact@v4
        with:
          name: qe-binaries
          path: |
            /tmp/qe/src/target/release/qe-desk
            /tmp/qe/src/target/release/qe-research
          retention-days: 3
